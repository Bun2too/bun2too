name: agent-triage
on:
  issues:
    types: [opened, labeled]
permissions:
  contents: read
  issues: write
  id-token: write
jobs:
  explore:
    if: (github.event.action == 'opened') || github.event.label.name == 'needs-triage'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: agent-triage-${{ github.event.issue.number }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v5
      - uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          prompt: Act as the Explore role in docs/factory.md for issue #${{ github.event.issue.number }}. Also apply the matching area:* label. Never apply ready-for-agent yourself while docs/factory.md says the Implement trigger is manual; recommend it in your comment instead.
          claude_args: --max-turns 40 --allowedTools "Read,Grep,Glob,Bash(gh issue view:*),Bash(gh issue comment:*),Bash(gh issue edit:*),Bash(git log:*)"
