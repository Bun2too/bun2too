name: agent-triage
on:
  issues:
    types: [opened, labeled]
permissions:
  contents: read
  issues: write
  id-token: write
jobs:
  explore:
    # Off unless FACTORY_LEGACY_AGENTS=true (AGENTS.md rule 11): this agent reads text from
    # anyone who opens an issue, holds the model key unsandboxed, and can post a comment, so
    # injected issue text could make it post the key. It comes back once it runs on the
    # split-job pattern: a sandboxed agent that writes the triage to a file, posted by a
    # job that secret-scans it.
    if: vars.FACTORY_ENABLED != 'false' && vars.FACTORY_LEGACY_AGENTS == 'true' && (vars.FACTORY_PROVIDER || 'anthropic') == 'anthropic' && ((github.event.action == 'opened') || github.event.label.name == 'needs-triage')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: agent-triage-${{ github.event.issue.number }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v5
      - uses: anthropics/claude-code-action@f431adaf77e0fecf918431e75a2b5b45b85af002 # v1.0.283
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          prompt: Act as the Explore role in docs/factory.md for issue #${{ github.event.issue.number }}. Also apply the matching area:* label. Never apply ready-for-agent yourself while docs/factory.md says the Implement trigger is manual; recommend it in your comment instead.
          claude_args: --model ${{ vars.FACTORY_MODEL || 'claude-sonnet-5-5' }} --max-budget-usd ${{ vars.FACTORY_MAX_BUDGET_USD || '1.00' }} --max-turns 40 --allowedTools "Read,Grep,Glob,Bash(gh issue view:*),Bash(gh issue comment:*),Bash(gh issue edit:*),Bash(git log:*)"
