name: ci
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
  pull-requests: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      support: ${{ steps.filter.outputs.support }}
      infra: ${{ steps.filter.outputs.infra }}
      crew: ${{ steps.filter.outputs.crew }}
      website: ${{ steps.filter.outputs.website }}
    steps:
      - uses: actions/checkout@v5
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            support: ['bun2too-support-agent/**', '!bun2too-support-agent/infra/terraform/**']
            infra: ['bun2too-support-agent/infra/terraform/**']
            crew: ['bun2too-crew-team/**']
            website: ['bun2too-website/**']

  support-agent:
    needs: changes
    if: needs.changes.outputs.support == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults: { run: { working-directory: bun2too-support-agent } }
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with: { package_json_file: bun2too-support-agent/package.json }
      - uses: actions/setup-node@v5
        with:
          node-version-file: bun2too-support-agent/.nvmrc
          cache: pnpm
          cache-dependency-path: bun2too-support-agent/pnpm-lock.yaml
      - uses: astral-sh/setup-uv@v6
      - run: pnpm install --frozen-lockfile
      - run: uv sync --directory services/agents --frozen
      - run: pnpm check
      # Each package must keep 65% line coverage (issue #10). The test runners enforce
      # it; no paid service is involved.
      - name: Coverage
        run: |
          for pkg in apps/gateway packages/contracts packages/telemetry; do
            (cd "$pkg" && pnpm exec vitest run --coverage --coverage.reporter=text-summary \
              --coverage.include='src/**' --coverage.thresholds.lines=65)
          done
          uv run --directory services/agents pytest -q --cov=relay_agents --cov-report=term --cov-fail-under=65

  support-infra:
    needs: changes
    if: needs.changes.outputs.infra == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      { run: { working-directory: bun2too-support-agent/infra/terraform } }
    steps:
      - uses: actions/checkout@v5
      - uses: hashicorp/setup-terraform@v3
      - run: terraform fmt -check -recursive
      - name: Validate and test the Railway module (mocked providers, no credentials)
        run: |
          terraform -chdir=railway init -backend=false -input=false
          terraform -chdir=railway validate
          terraform -chdir=railway test

  crew-team:
    needs: changes
    if: needs.changes.outputs.crew == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults: { run: { working-directory: bun2too-crew-team } }
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - uses: actions/setup-node@v5
        with: { node-version: "24" }
      - run: python3 -m pip install -r crewai_agents/requirements.txt coverage==7.17.4
      - run: python3 scripts/verify_marketing.py
      - run: node --test evals/*.test.mjs
      # 65% line coverage, enforced by coverage.py.
      - name: Coverage
        run: |
          for suite in tests crewai_agents/tests; do
            python3 -m coverage run -p --source=. -m unittest discover -s "$suite"
          done
          python3 -m coverage combine
          python3 -m coverage report --omit='*/tests/*,tests/*' --fail-under=65

  website:
    needs: changes
    if: needs.changes.outputs.website == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults: { run: { working-directory: bun2too-website } }
    env: { NEXT_TELEMETRY_DISABLED: "1" }
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: bun2too-website/.nvmrc
          cache: npm
          cache-dependency-path: bun2too-website/package-lock.json
      - run: npm ci
      - run: npm run docs:check
      - run: npm run typecheck
      # npm test under c8, which fails below 65% line coverage. --all also counts source
      # files that no test loads.
      - run: >-
          npx -y c8@10.1.3 --all --include='src/**' --exclude='src/**/*.d.ts'
          --reporter=text-summary --check-coverage --lines 65 npm test

  secrets:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v5
        with: { fetch-depth: 0 }
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: "${{ secrets.GITHUB_TOKEN }}"
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}
          GITLEAKS_ENABLE_COMMENTS: "true"

  ci:
    # The single required status check for branch protection.
    if: always()
    needs: [support-agent, support-infra, crew-team, website, secrets]
    runs-on: ubuntu-latest
    steps:
      - run: |
          echo '${{ toJSON(needs) }}' | jq -e 'all(.[]; .result == "success" or .result == "skipped")'
