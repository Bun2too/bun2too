name: ci
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
  pull-requests: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      support: ${{ steps.filter.outputs.support }}
      infra: ${{ steps.filter.outputs.infra }}
      crew: ${{ steps.filter.outputs.crew }}
      website: ${{ steps.filter.outputs.website }}
    steps:
      - uses: actions/checkout@v5
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            support: ['bun2too-support-agent/**', '!bun2too-support-agent/infra/terraform/**']
            infra: ['bun2too-support-agent/infra/terraform/**']
            crew: ['bun2too-crew-team/**']
            website: ['bun2too-website/**']

  support-agent:
    needs: changes
    if: needs.changes.outputs.support == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults: { run: { working-directory: bun2too-support-agent } }
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with: { package_json_file: bun2too-support-agent/package.json }
      - uses: actions/setup-node@v5
        with:
          node-version-file: bun2too-support-agent/.nvmrc
          cache: pnpm
          cache-dependency-path: bun2too-support-agent/pnpm-lock.yaml
      - uses: astral-sh/setup-uv@v6
      - run: pnpm install --frozen-lockfile
      - run: uv sync --directory services/agents --frozen
      - run: pnpm check
      # Line coverage for the main ruleset's minimum (65%), as Cobertura: issue #10.
      - name: Coverage
        run: |
          out="$RUNNER_TEMP/coverage"
          for pkg in apps/gateway packages/contracts packages/telemetry; do
            (cd "$pkg" && pnpm exec vitest run --coverage --coverage.reporter=cobertura \
              --coverage.include='src/**' --coverage.reportsDirectory="$out/${pkg##*/}")
          done
          uv run --directory services/agents pytest -q --cov=relay_agents --cov-report="xml:$out/agents.xml"
          mkdir -p "$GITHUB_WORKSPACE/coverage"
          python3 "$GITHUB_WORKSPACE/.github/scripts/coverage-paths.py" --out "$GITHUB_WORKSPACE/coverage/support-agent.xml" \
            "$out"/{gateway,contracts,telemetry}/cobertura-coverage.xml "$out/agents.xml"
      - uses: actions/upload-artifact@v4
        with: { name: coverage-support-agent, path: coverage/support-agent.xml, retention-days: 1 }

  support-infra:
    needs: changes
    if: needs.changes.outputs.infra == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      { run: { working-directory: bun2too-support-agent/infra/terraform } }
    steps:
      - uses: actions/checkout@v5
      - uses: hashicorp/setup-terraform@v3
      - run: terraform fmt -check -recursive
      - name: Validate and test both Railway layers (mocked providers, no credentials)
        run: |
          for layer in railway/project railway/environment; do
            terraform -chdir=$layer init -backend=false -input=false
            terraform -chdir=$layer validate
            terraform -chdir=$layer test
          done

  crew-team:
    needs: changes
    if: needs.changes.outputs.crew == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults: { run: { working-directory: bun2too-crew-team } }
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - uses: actions/setup-node@v5
        with: { node-version: "24" }
      - run: python3 -m pip install -r crewai_agents/requirements.txt coverage==7.17.4
      - run: python3 scripts/verify_marketing.py
      - run: node --test evals/*.test.mjs
      - name: Coverage
        run: |
          for suite in tests crewai_agents/tests; do
            python3 -m coverage run -p --source=. -m unittest discover -s "$suite"
          done
          python3 -m coverage combine
          python3 -m coverage xml -o "$RUNNER_TEMP/crew.xml" --omit='*/tests/*,tests/*'
          mkdir -p "$GITHUB_WORKSPACE/coverage"
          python3 "$GITHUB_WORKSPACE/.github/scripts/coverage-paths.py" --out "$GITHUB_WORKSPACE/coverage/crew-team.xml" "$RUNNER_TEMP/crew.xml"
      - uses: actions/upload-artifact@v4
        with: { name: coverage-crew-team, path: coverage/crew-team.xml, retention-days: 1 }

  website:
    needs: changes
    if: needs.changes.outputs.website == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults: { run: { working-directory: bun2too-website } }
    env: { NEXT_TELEMETRY_DISABLED: "1" }
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: bun2too-website/.nvmrc
          cache: npm
          cache-dependency-path: bun2too-website/package-lock.json
      - run: npm ci
      - run: npm run docs:check
      - run: npm run typecheck
      # npm test under c8; --all counts source files no test loads.
      - run: >-
          npx -y c8@10.1.3 --all --include='src/**' --exclude='src/**/*.d.ts'
          --reporter=cobertura --reporter=text-summary --reports-dir="$RUNNER_TEMP/c8" npm test
      - run: |
          mkdir -p "$GITHUB_WORKSPACE/coverage"
          python3 "$GITHUB_WORKSPACE/.github/scripts/coverage-paths.py" --out "$GITHUB_WORKSPACE/coverage/website.xml" "$RUNNER_TEMP/c8/cobertura-coverage.xml"
      - uses: actions/upload-artifact@v4
        with: { name: coverage-website, path: coverage/website.xml, retention-days: 1 }

  secrets:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v5
        with: { fetch-depth: 0 }
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: "${{ secrets.GITHUB_TOKEN }}"
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}
          GITLEAKS_ENABLE_COMMENTS: "true"

  # Uploads the products' coverage for the main ruleset's coverage rule. It runs none of
  # the PR's code, so it alone holds code-quality: write.
  coverage:
    needs: [support-agent, crew-team, website]
    if: >-
      always() && (github.event_name == 'push'
      || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      code-quality: write
    steps:
      - uses: actions/download-artifact@v4
        with: { pattern: coverage-*, path: coverage, merge-multiple: true }
      - if: hashFiles('coverage/support-agent.xml') != ''
        uses: actions/upload-code-coverage@v1
        with: { file: coverage/support-agent.xml, language: TypeScript, label: code-coverage/support-agent }
      - if: hashFiles('coverage/crew-team.xml') != ''
        uses: actions/upload-code-coverage@v1
        with: { file: coverage/crew-team.xml, language: Python, label: code-coverage/crew-team }
      - if: hashFiles('coverage/website.xml') != ''
        uses: actions/upload-code-coverage@v1
        with: { file: coverage/website.xml, language: TypeScript, label: code-coverage/website }

  ci:
    # The single required status check for branch protection.
    if: always()
    needs: [support-agent, support-infra, crew-team, website, secrets]
    runs-on: ubuntu-latest
    steps:
      - run: |
          echo '${{ toJSON(needs) }}' | jq -e 'all(.[]; .result == "success" or .result == "skipped")'
