name: Infrastructure and Core Deployment Pipeline

on:
  push:
    branches: [ main, qa ]

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: ${{ github.ref_name == 'main' && 'production' || 'qa' }}
    # Both branches share one Railway project; serialize infrastructure changes.
    concurrency:
      group: railway-${{ github.repository }}
      cancel-in-progress: false
    env:
      DEPLOY_ENVIRONMENT: ${{ github.ref_name == 'main' && 'production' || 'qa' }}
      TF_WORKSPACE: ${{ github.ref_name == 'main' && 'bun2too-production' || 'bun2too-qa' }}
      TF_CLOUD_ORGANIZATION: ${{ vars.TF_CLOUD_ORGANIZATION }}
      RAILWAY_PROJECT_ID: ${{ vars.RAILWAY_PROJECT_ID }}
      RAILWAY_ENVIRONMENT_ID: ${{ vars.RAILWAY_ENVIRONMENT_ID }}
      POSTGRES_SERVICE_ID: ${{ vars.POSTGRES_SERVICE_ID }}
      CREWAI_SERVICE_ID: ${{ vars.CREWAI_SERVICE_ID }}
    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v6

      - name: Verify environment, credentials and deployment targets
        env:
          RAILWAY_API_TOKEN: ${{ secrets.RAILWAY_API_TOKEN }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          TF_API_TOKEN: ${{ secrets.TF_API_TOKEN }}
        run: |
          git log -1 --format="Deployment checkout: %H"
          python3 scripts/check_deployment.py

      - name: Install and Setup Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_wrapper: false
          cli_config_credentials_token: ${{ secrets.TF_API_TOKEN }}

      - name: Terraform Initialize and Apply
        env:
          # Terraform uses RAILWAY_TOKEN for account/workspace tokens.
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_API_TOKEN }}
          TF_VAR_deployment_environment: ${{ env.DEPLOY_ENVIRONMENT }}
          TF_VAR_railway_project_id: ${{ env.RAILWAY_PROJECT_ID }}
          TF_VAR_railway_environment_id: ${{ env.RAILWAY_ENVIRONMENT_ID }}
          TF_VAR_postgres_service_id: ${{ env.POSTGRES_SERVICE_ID }}
          TF_VAR_crewai_service_id: ${{ env.CREWAI_SERVICE_ID }}
          TF_VAR_github_repository: ${{ github.repository }}
          TF_VAR_postgres_password: ${{ secrets.POSTGRES_PASSWORD }}
          TF_VAR_postgres_user: ${{ vars.POSTGRES_USER || 'postgres' }}
          TF_VAR_postgres_database: ${{ vars.POSTGRES_DB || 'bun2too' }}
          TF_IN_AUTOMATION: 'true'
        run: |
          cd terraform
          terraform init -input=false
          terraform validate
          if [[ "$DEPLOY_ENVIRONMENT" == production ]]; then
            terraform state list > "$RUNNER_TEMP/railway-state.txt"
            for resource in railway_project.fb_pipeline railway_service.postgres_db railway_service.crewai_service railway_service.n8n_engine; do
              if ! grep -Fxq "$resource" "$RUNNER_TEMP/railway-state.txt" && ! grep -Fxq "${resource}[0]" "$RUNNER_TEMP/railway-state.txt"; then
                echo "::error::Import or migrate the existing production resources into bun2too-production before deployment. See docs/deployment.md."
                exit 1
              fi
            done
          fi
          terraform apply -input=false -auto-approve

      - name: Verify Postgres password reached Railway
        env:
          RAILWAY_API_TOKEN: ${{ secrets.RAILWAY_API_TOKEN }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
        run: python3 scripts/check_deployment.py --verify-postgres

      - name: Set up Node.js 24 for Railway CLI
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Install Railway CLI Engine
        run: npm install -g @railway/cli

      - name: Deploy CrewAI to selected environment
        env:
          RAILWAY_API_TOKEN: ${{ secrets.RAILWAY_API_TOKEN }}
        run: |
          railway up --project "$RAILWAY_PROJECT_ID" --service "$CREWAI_SERVICE_ID" --environment "$RAILWAY_ENVIRONMENT_ID" --ci
