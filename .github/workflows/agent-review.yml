name: agent-review
on:
  pull_request:
    types: [opened, synchronize, ready_for_review, labeled]
permissions:
  contents: read
  pull-requests: write
  issues: read
  id-token: write
concurrency:
  group: agent-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  review:
    if: github.event.pull_request.draft == false || contains(github.event.pull_request.labels.*.name, 'agent-review')
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
        with: { fetch-depth: 0 }
      - uses: anthropics/claude-code-action@v1
        id: claude
        continue-on-error: true
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          # The repo is private; without this a failed review leaves no reason in the log.
          show_full_output: true
          prompt: |
            Act as the Review role in docs/factory.md: follow .claude/skills/factory-review/SKILL.md for PR #${{ github.event.pull_request.number }}.
            Base branch: origin/${{ github.event.pull_request.base.ref }}. Head commit: ${{ github.event.pull_request.head.sha }}.
            Post exactly one comment with gh pr comment.
          claude_args: --max-turns 40 --allowedTools "Read,Grep,Glob,Agent,Bash(git diff:*),Bash(git log:*),Bash(git merge-base:*),Bash(gh pr view:*),Bash(gh pr diff:*),Bash(gh issue view:*),Bash(gh pr comment:*)"
      - name: Make sure the PR got a review
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          OUTCOME: ${{ steps.claude.outcome }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}/attempts/${{ github.run_attempt }}
        run: |
          posted=$(gh api --paginate "repos/$GH_REPO/issues/$PR/comments" \
            --jq "[.[] | select(.user.login == \"claude[bot]\" and (.body | contains(\"Reviewed commit: $HEAD_SHA\")))] | length" |
            awk '{ n += $1 } END { print n + 0 }')
          if [ "$posted" -gt 0 ] && [ "$OUTCOME" = success ]; then exit 0; fi
          if [ "$posted" = 0 ]; then
            gh pr comment "$PR" --body "$(printf '## Factory review did not complete\n\nNo review was posted for `%s` (agent step: %s). See the run log for the cause: %s\n\nThere is no verdict, so no rework starts. Re-run the review once the cause is fixed.' "$HEAD_SHA" "$OUTCOME" "$RUN_URL")"
          fi
          exit 1
