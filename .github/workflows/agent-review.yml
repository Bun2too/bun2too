name: agent-review
# One loop per PR: wait for CI, review, then merge on PASS or rework the PR in the same run.
# The rework pushes to the PR, which starts this workflow again, until the review
# passes, the rework rounds run out, or something needs a person.
#
# AGENTS.md rule 12: the loop spends only when a person asks. A person adding the
# agent-review label starts it, and the run takes the label off again. Only the loop's own
# rework push, which puts the label back first, continues it. A plain push, a new PR or a
# PR marked ready starts nothing paid. FACTORY_MAX_RUNS_PER_DAY and FACTORY_MAX_USD_PER_DAY
# cap the loop a day. A factory PR gets reviews and merges on PASS, but never a paid rework
# round, because the rework agent may not edit factory files.
#
# The agent runs in its own job with a read-only token and no app credentials, because
# it can write anywhere on its runner. Jobs on fresh runners post, push and merge.
#
# Settings (repository variables; see docs/factory.md#spend-and-safety):
#   FACTORY_ENABLED=false stops every agent run. FACTORY_PROVIDER (anthropic|openai|gemini),
#   FACTORY_MODEL and FACTORY_MAX_BUDGET_USD choose the model and cap each run.
on:
  pull_request:
    types: [synchronize, labeled]
permissions:
  contents: read
# One loop per PR: a new request or rework push cancels the run in progress. Any other
# event (a person's push, another label) gets a group of its own, so it never cancels a
# running review; prepare then skips it.
concurrency:
  group: >-
    ${{ ((github.event.action == 'labeled' && github.event.label.name == 'agent-review' && github.actor != 'bun2too-software-factory[bot]') ||
         (github.event.action == 'synchronize' && github.actor == 'bun2too-software-factory[bot]' &&
          contains(github.event.pull_request.labels.*.name, 'agent-review')))
        && format('agent-review-{0}', github.event.pull_request.number) || format('agent-review-other-{0}', github.run_id) }}
  cancel-in-progress: true
env:
  GH_REPO: ${{ github.repository }}
  PR: ${{ github.event.pull_request.number }}
  HEAD_SHA: ${{ github.event.pull_request.head.sha }}
  FACTORY_BOT: bun2too-software-factory[bot]
jobs:
  prepare:
    # Rule 12: a person's agent-review label, or the loop's own rework push (the factory
    # app's push, made while the rework round has put the label back).
    if: >
      vars.FACTORY_ENABLED != 'false' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      ((github.event.action == 'labeled' && github.event.label.name == 'agent-review' && github.actor != 'bun2too-software-factory[bot]') ||
       (github.event.action == 'synchronize' && github.actor == 'bun2too-software-factory[bot]' &&
        contains(github.event.pull_request.labels.*.name, 'agent-review')))
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # checks: read only to read the factory-cost notices for the daily spend limit.
    permissions: { contents: read, actions: read, checks: read, pull-requests: write, issues: write }
    outputs:
      earlier: ${{ steps.earlier.outputs.url }}
      ci: ${{ steps.ci.outputs.result }}
      limited: ${{ steps.limit.outputs.limited }}
    steps:
      # The label is a request for one loop: this run takes it, so nothing that comes later
      # (a push, an autofix commit) runs on it. A rework round puts it back for its own push.
      # A person's request answers any hand-off, so the loop gets a fresh set of rounds.
      # Label changes use the workflow token, so they never start a run.
      - name: Take the request
        env: { GH_TOKEN: "${{ github.token }}", ACTION: "${{ github.event.action }}" }
        run: |
          gh pr edit "$PR" --remove-label agent-review || true
          if [ "$ACTION" = labeled ]; then
            for l in $(gh pr view "$PR" --json labels -q '.labels[].name' | grep -xE 'ready-for-human|rework-[0-9]+' || true); do
              gh pr edit "$PR" --remove-label "$l"
            done
          fi
      # Rule 12's backstops, per day (UTC) across the repository: at most
      # FACTORY_MAX_RUNS_PER_DAY loop runs, and no new run once the factory's agents have
      # spent FACTORY_MAX_USD_PER_DAY. Spend is the sum of the factory-cost notices the
      # factory-agent action leaves on each agent job (review, rework, sandbox probe).
      - name: Check the daily limit
        id: limit
        env:
          GH_TOKEN: ${{ github.token }}
          MAX: ${{ vars.FACTORY_MAX_RUNS_PER_DAY || '4' }}
          MAX_USD: ${{ vars.FACTORY_MAX_USD_PER_DAY || '0.40' }}
        run: |
          if ! [[ "$MAX" =~ ^[0-9]{1,3}$ ]]; then
            echo "::warning::FACTORY_MAX_RUNS_PER_DAY='$MAX' is not a number from 0 to 999; using 4"
            MAX=4
          fi
          if ! [[ "$MAX_USD" =~ ^[0-9]{1,4}(\.[0-9]{1,4})?$ ]]; then
            echo "::warning::FACTORY_MAX_USD_PER_DAY='$MAX_USD' is not an amount like 0.40; using 0.40"
            MAX_USD=0.40
          fi
          today=$(date -u +%F)
          runs() {
            gh api --paginate "repos/$GH_REPO/actions/workflows/$1/runs?created=>=$today&per_page=100" \
              --jq ".workflow_runs[] | select(.conclusion != \"skipped\" and .id != $GITHUB_RUN_ID) | .id"
          }
          # Runs whose prepare job ran (a skipped run concludes "skipped"), this one excluded.
          loop=$(runs agent-review.yml)
          used=$(printf '%s' "$loop" | grep -c . || true)
          spent=$(for run in $loop $(runs factory-sandbox-check.yml); do
                    gh api --paginate "repos/$GH_REPO/actions/runs/$run/jobs?per_page=100" --jq '.jobs[].id'
                  done | while read -r job; do
                    gh api "repos/$GH_REPO/check-runs/$job/annotations" \
                      --jq '.[] | select(.title == "factory-cost") | .message'
                  done | awk '{ s += $1 } END { printf "%.4f", s }')
          echo "Today: $used of $MAX loop runs, \$$spent of \$$MAX_USD spent"
          why=""
          if [ "$used" -ge "$MAX" ]; then
            why="has used its $MAX loop runs for today (\`FACTORY_MAX_RUNS_PER_DAY\`)"
          elif awk -v s="$spent" -v m="$MAX_USD" 'BEGIN { exit !(s >= m) }'; then
            why="has spent \$$spent of its \$$MAX_USD for today (\`FACTORY_MAX_USD_PER_DAY\`)"
          fi
          if [ -n "$why" ]; then
            echo "limited=true" >> "$GITHUB_OUTPUT"
            gh pr comment "$PR" --body "The factory $why, UTC, so this PR was not reviewed. Add the \`agent-review\` label again tomorrow, or raise the limit."
          fi
      # Only a model's PASS or FAIL is reused. A red-CI "review" or an INCONCLUSIVE one is
      # not, so re-running this workflow (after a flaky CI, say) reviews the commit again.
      - name: Reuse an earlier review of this commit
        id: earlier
        if: steps.limit.outputs.limited != 'true'
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          url=$(gh api --paginate "repos/$GH_REPO/issues/$PR/comments" \
            --jq ".[] | select(.user.login == \"$FACTORY_BOT\" and (.body | startswith(\"Reviewed commit: $HEAD_SHA\"))
                  and (.body | contains(\"Reviewed by CI (no model)\") | not)
                  and (.body | contains(\"VERDICT: INCONCLUSIVE\") | not)) | .html_url" | tail -n 1)
          echo "url=$url" >> "$GITHUB_OUTPUT"
          [ -z "$url" ] || echo "This commit was already reviewed, so no model runs: $url"
      - name: Wait for CI on this commit
        id: ci
        if: steps.limit.outputs.limited != 'true' && steps.earlier.outputs.url == ''
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          mkdir -p factory
          id=""
          for _ in $(seq 30); do
            id=$(gh run list --workflow ci.yml --commit "$HEAD_SHA" --json databaseId -q '.[0].databaseId // empty')
            [ -n "$id" ] && break
            sleep 10
          done
          if [ -z "$id" ]; then echo "result=did not start" >> "$GITHUB_OUTPUT"; exit 0; fi
          if gh run watch "$id" --interval 30 --exit-status > /dev/null; then
            echo "result=passed" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "result=failed" >> "$GITHUB_OUTPUT"
          # A red CI needs no model to judge it: the failing log is the review, at no cost.
          {
            echo "## CI"
            echo
            echo "CI failed on this commit, so the code review was skipped. Each failing step below is a Critical finding."
            echo
            echo '```'
            gh run view "$id" --log-failed | tail -c 20000
            echo '```'
            echo
            echo "VERDICT: FAIL"
          } > factory/review.md
      - uses: actions/upload-artifact@v6
        if: steps.ci.outputs.result == 'failed'
        with: { name: review, path: factory/review.md }

  review:
    needs: prepare
    if: needs.prepare.outputs.limited != 'true' && needs.prepare.outputs.earlier == '' && needs.prepare.outputs.ci != 'failed'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Read-only: this job runs the agent. It holds only the model provider's key.
    permissions: { contents: read, pull-requests: read }
    steps:
      # AGENTS.md rule 11, layer 3: only the hosts this job needs. Keep this list in step
      # with agent-rework.yml and factory-sandbox-check.yml.
      - uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: block
          disable-telemetry: true
          allowed-endpoints: >
            api.anthropic.com:443 api.openai.com:443 generativelanguage.googleapis.com:443
            github.com:443 api.github.com:443 codeload.github.com:443
            objects.githubusercontent.com:443 release-assets.githubusercontent.com:443
            results-receiver.actions.githubusercontent.com:443 *.blob.core.windows.net:443
            registry.npmjs.org:443 bun.sh:443 claude.ai:443 downloads.claude.ai:443
            azure.archive.ubuntu.com:80 archive.ubuntu.com:80 security.ubuntu.com:80
      # The exact head commit, not GitHub's merge commit, so the review is of HEAD_SHA.
      - uses: actions/checkout@v5
        with: { ref: "${{ env.HEAD_SHA }}", fetch-depth: 0, persist-credentials: false }
      - name: Write the PR context for the reviewer
        env: { GH_TOKEN: "${{ github.token }}", BASE_REF: "${{ github.event.pull_request.base.ref }}" }
        run: |
          mkdir -p .factory && echo ".factory/" >> .git/info/exclude
          # The diff as a file, written before any agent runs: a reviewer without a shell
          # (Gemini) reads this instead of running git.
          git -c core.hooksPath=/dev/null -c core.fsmonitor=false \
            diff --no-ext-diff "origin/$BASE_REF...HEAD" > .factory/diff.patch
          gh pr view "$PR" --json title,body,files -q '"# \(.title)\n\n\(.body)\n\nFiles:\n\(.files | map("- " + .path) | join("\n"))"' > .factory/pr.md
      - uses: ./.github/actions/factory-lockdown
        with: { provider: "${{ vars.FACTORY_PROVIDER || 'anthropic' }}" }
      - uses: ./.github/actions/factory-agent
        id: agent
        continue-on-error: true
        with:
          provider: ${{ vars.FACTORY_PROVIDER || 'anthropic' }}
          model: ${{ vars.FACTORY_MODEL }}
          max-budget-usd: ${{ vars.FACTORY_MAX_BUDGET_USD || '0.50' }}
          max-turns: "30"
          github-token: ${{ github.token }}
          anthropic-api-key: ${{ secrets.ANTHROPIC_API_KEY }}
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}
          gemini-api-key: ${{ secrets.GEMINI_API_KEY }}
          # No Write: a reviewer that could edit .git/config could make `git diff` run a command.
          # Its final message is the review.
          read-only: "true"
          output-file: ${{ runner.temp }}/out/review.md
          trace-dir: ${{ runner.temp }}/trace
          allowed-tools: Read,Grep,Glob,Agent,Bash(git diff:*),Bash(git log:*),Bash(git show:*),Bash(git merge-base:*)
          prompt: |
            Act as the Review role in docs/factory.md: follow .claude/skills/factory-review/SKILL.md for PR #${{ env.PR }}.
            The diff is in .factory/diff.patch: `git diff origin/${{ github.event.pull_request.base.ref }}...HEAD` at head commit
            ${{ env.HEAD_SHA }}, which is checked out. Use git for history and context if you have it.
            The PR's title, description and files are in .factory/pr.md. CI result: ${{ needs.prepare.outputs.ci }}.
            Do not post anything and do not change any file. Your final message is the review, posted as is:
            only the sections `## Code`, `## Security` and `## Spec`, with nothing before or after them except the
            last line, which is exactly one of `VERDICT: PASS`, `VERDICT: FAIL` or `VERDICT: INCONCLUSIVE`.
            If you cannot run subagents, do the three reviews yourself, one after another.
      - name: Hand the review on
        if: ${{ !cancelled() }}
        env: { CAUSE: "${{ steps.agent.outputs.cause }}", OUTCOME: "${{ steps.agent.outcome }}" }
        run: |
          mkdir -p "$RUNNER_TEMP/out"
          printf 'agent step: %s. Cause: %s' "$OUTCOME" "${CAUSE:-not reported; see the run log}" > "$RUNNER_TEMP/out/cause.txt"
      - uses: actions/upload-artifact@v6
        if: ${{ !cancelled() }}
        with: { name: review, path: "${{ runner.temp }}/out/" }
      # For the trace job only, which scans it and then deletes it.
      - uses: actions/upload-artifact@v6
        if: ${{ !cancelled() }}
        with: { name: trace-review, path: "${{ runner.temp }}/trace/", if-no-files-found: ignore, retention-days: 1 }

  # A fresh runner: the only job here that holds the app token is one no agent touched.
  verdict:
    needs: [prepare, review]
    # Runs when prepare failed too, so a broken run still says so on the PR.
    if: ${{ !cancelled() && needs.prepare.result != 'skipped' && needs.prepare.outputs.limited != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions: { contents: read }
    outputs:
      verdict: ${{ steps.verdict.outputs.verdict }}
      review_url: ${{ steps.verdict.outputs.url }}
    steps:
      - uses: actions/download-artifact@v7
        if: needs.prepare.outputs.earlier == ''
        continue-on-error: true
        with: { name: review, path: in }
      # Rule 11, layer 4: nothing the agent wrote is posted if it holds a secret. The scan
      # comes from the PR's own .github/actions, as trusted as this workflow, which on a
      # pull_request run also comes from the PR. Agents cannot change it (the guard keeps
      # them out of .github/), so it is a control on the agent, not on the PR's author.
      - uses: actions/checkout@v5
        with: { ref: "${{ github.event.pull_request.head.sha }}", sparse-checkout: .github/actions, persist-credentials: false, path: scan }
      - uses: ./scan/.github/actions/secret-scan
        id: scan
        continue-on-error: true
        with:
          path: in
          anthropic-api-key: ${{ secrets.ANTHROPIC_API_KEY }}
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}
          gemini-api-key: ${{ secrets.GEMINI_API_KEY }}
      # The app token is minted only after the scan, so no earlier step can see it.
      - uses: actions/create-github-app-token@1b10c78c7865c340bc4f6099eb2f838309f1e8c3 # v3.1.1
        id: app
        with:
          app-id: ${{ vars.FACTORY_APP_ID }}
          private-key: ${{ secrets.FACTORY_APP_PRIVATE_KEY }}
      - name: Post the review and read the verdict
        id: verdict
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          EARLIER: ${{ needs.prepare.outputs.earlier }}
          PREPARE: ${{ needs.prepare.result }}
          LEAK: ${{ steps.scan.outputs.found || 'unscanned' }}
          MODEL: ${{ vars.FACTORY_PROVIDER || 'anthropic' }} ${{ vars.FACTORY_MODEL || 'claude-sonnet-5-5' }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}/attempts/${{ github.run_attempt }}
          TRACE_URL: ${{ vars.FACTORY_TRACE_URL }}
        run: |
          # The trace job names the trace after the run (docs/factory.md#tracing).
          trace_id=$(printf '%s' "$GH_REPO/$GITHUB_RUN_ID/$GITHUB_RUN_ATTEMPT" | sha256sum | cut -c1-32)
          links="[run summary]($RUN_URL)"
          [ -z "$TRACE_URL" ] || links="$links · [trace](${TRACE_URL//\{trace_id\}/$trace_id})"
          # The verdict is the review's last line and nothing else; text quoted earlier in the
          # review (from a diff, say) cannot set it. The footer line is skipped.
          last_verdict() {
            grep -v '^[[:space:]]*$' | grep -v '^<sub>' | tail -n 1 | tr -d '*`' |
              sed -nE 's/^[[:space:]]*VERDICT: (PASS|FAIL|INCONCLUSIVE)[[:space:]]*$/\1/p'
          }
          verdict=""
          mkdir -p in
          if [ "$LEAK" != false ]; then
            rm -rf in && mkdir in
            if [ "$LEAK" = true ]; then
              echo "the agent's output contained a secret, so none of it was posted (AGENTS.md rule 11). Rotate the provider key" > in/cause.txt
            else
              echo "the secret scan of the agent's output did not run, so none of it was posted (AGENTS.md rule 11)" > in/cause.txt
            fi
          fi
          if [ "$PREPARE" != success ]; then
            echo "the prepare job failed before the review, while reading earlier reviews or waiting for CI" > in/cause.txt
          elif [ -n "$EARLIER" ]; then
            verdict=$(gh api "repos/$GH_REPO/issues/comments/${EARLIER##*-}" -q .body | last_verdict)
            url=$EARLIER
          elif [ -s in/review.md ]; then
            verdict=$(last_verdict < in/review.md)
          fi
          if [ -z "$EARLIER" ] && [ -n "$verdict" ]; then
            reviewer=$MODEL; grep -q '^## CI$' in/review.md && reviewer="CI (no model)"
            text=$(cat in/review.md)
            # GitHub caps a comment at 65,536 characters. Cut the middle, never the verdict.
            if [ ${#text} -gt 60000 ]; then
              text=$(printf '%s\n\n(Review cut at 60,000 characters; the full text is in the run'"'"'s review artifact.)\n\nVERDICT: %s' "${text:0:60000}" "$verdict")
            fi
            url=$(gh pr comment "$PR" --body "$(printf 'Reviewed commit: %s\n\n%s\n\n<sub>Reviewed by %s · %s</sub>' "$HEAD_SHA" "$text" "$reviewer" "$links")")
          elif [ -z "$verdict" ]; then
            [ -s in/review.md ] && echo "agent step finished, but the review does not end with a VERDICT line" > in/cause.txt
            cause=$(head -c 600 in/cause.txt 2>/dev/null || echo "the review job did not finish")
            gh pr comment "$PR" --body "$(printf '## Factory review did not complete\n\nNo review was written for `%s` (%s).\n\nRun log: %s\n\nThere is no verdict, so no rework starts. Push a fix or re-run this workflow once the cause is fixed.' "$HEAD_SHA" "$cause" "$RUN_URL")"
            exit 1
          fi
          { echo "verdict=$verdict"; echo "url=$url"; } >> "$GITHUB_OUTPUT"
          echo "Verdict: $verdict ($url)"
          [ "$verdict" = PASS ]

  rework:
    needs: verdict
    if: ${{ !cancelled() && needs.verdict.outputs.verdict == 'FAIL' }}
    permissions: { contents: read, pull-requests: write, issues: write }
    uses: ./.github/workflows/agent-rework.yml
    with:
      pr: ${{ github.event.pull_request.number }}
      review_url: ${{ needs.verdict.outputs.review_url }}
      head_sha: ${{ github.event.pull_request.head.sha }}
    secrets: inherit

  merge:
    needs: verdict
    if: ${{ !cancelled() && needs.verdict.outputs.verdict == 'PASS' && !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions: { contents: read, actions: read }
    steps:
      - uses: actions/create-github-app-token@1b10c78c7865c340bc4f6099eb2f838309f1e8c3 # v3.1.1
        id: app
        with:
          app-id: ${{ vars.FACTORY_APP_ID }}
          private-key: ${{ secrets.FACTORY_APP_PRIVATE_KEY }}
      - name: Merge the reviewed commit
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          CI_TOKEN: ${{ github.token }}
        run: |
          # Factory PRs merge like product PRs (AGENTS.md rules 9 and 10, 2026-11-21).
          # CI must be green on this exact commit, even when the review was reused.
          ci=$(GH_TOKEN=$CI_TOKEN gh run list --workflow ci.yml --commit "$HEAD_SHA" --json conclusion -q '.[0].conclusion // empty')
          if [ "$ci" != success ]; then
            gh pr comment "$PR" --body "Review passed, but CI on \`$HEAD_SHA\` is \`${ci:-missing}\`. Not merging."
            exit 1
          fi
          # --match-head-commit: never merge a commit the review did not see.
          if ! out=$(gh pr merge "$PR" --rebase --match-head-commit "$HEAD_SHA" 2>&1); then
            gh pr comment "$PR" --body "$(printf 'Review and CI passed, but the merge failed:\n\n```\n%s\n```' "$out")"
            exit 1
          fi

  # One OpenTelemetry trace of the whole run: jobs and steps, and inside the agents every
  # model turn, tool call and subagent, plus a job summary of it. See docs/factory.md#tracing.
  # No agent touched this runner. It reads agent transcripts as data and scans them first.
  trace:
    needs: [prepare, review, verdict, rework, merge]
    if: ${{ always() && needs.prepare.result != 'skipped' && needs.prepare.outputs.limited != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # actions: write only to delete the unscanned transcripts once the trace is built.
    permissions: { contents: read, actions: write }
    steps:
      - uses: actions/checkout@v5
        with: { ref: "${{ env.HEAD_SHA }}", sparse-checkout: .github, persist-credentials: false, path: scan }
      - uses: actions/download-artifact@v7
        continue-on-error: true
        with: { pattern: trace-*, path: traces }
      # Rule 11, layer 4: a flagged transcript loses its content (prompts, replies, tool
      # input and output); the timings, token counts and tool names still go out.
      - uses: ./scan/.github/actions/secret-scan
        id: scan
        continue-on-error: true
        with:
          path: traces
          anthropic-api-key: ${{ secrets.ANTHROPIC_API_KEY }}
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}
          gemini-api-key: ${{ secrets.GEMINI_API_KEY }}
      - name: Build the trace, send it, and write the job summary
        env:
          GH_TOKEN: ${{ github.token }}
          LEAK: ${{ steps.scan.outputs.found || 'unscanned' }}
          VERDICT: ${{ needs.verdict.outputs.verdict }}
          OTLP_ENDPOINT: ${{ vars.FACTORY_OTLP_ENDPOINT }}
          OTLP_HEADERS: ${{ secrets.FACTORY_OTLP_HEADERS }}
          TRACE_URL: ${{ vars.FACTORY_TRACE_URL }}
        run: |
          mkdir -p traces out
          gh api --paginate "repos/$GH_REPO/actions/runs/$GITHUB_RUN_ID/attempts/$GITHUB_RUN_ATTEMPT/jobs" --jq '.jobs[]' > out/jobs.jsonl
          content=()
          [ "$LEAK" = false ] || content=(--no-content)
          python3 scan/.github/scripts/factory-trace.py "${content[@]}" --jobs out/jobs.jsonl --traces traces \
            --repo "$GH_REPO" --run-id "$GITHUB_RUN_ID" --attempt "$GITHUB_RUN_ATTEMPT" --pr "$PR" --head-sha "$HEAD_SHA" \
            --verdict "$VERDICT" --trace-url "$TRACE_URL" --out out/trace.otlp.json --summary "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v6
        with: { name: trace, path: out/trace.otlp.json, if-no-files-found: ignore, retention-days: 30 }
      - name: Delete the unscanned transcripts
        if: always()
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          for id in $(gh api --paginate "repos/$GH_REPO/actions/runs/$GITHUB_RUN_ID/artifacts" \
                        --jq '.artifacts[] | select(.name | startswith("trace-")) | .id'); do
            gh api -X DELETE "repos/$GH_REPO/actions/artifacts/$id"
          done
