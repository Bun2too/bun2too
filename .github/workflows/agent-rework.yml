name: agent-rework
# Called by agent-review when a review ends in VERDICT: FAIL.
#   plan:   decides whether this round may run and marks it.
#   rework: the agent fixes the findings and commits locally, on a runner with a read-only
#           token and no app credentials. Its commits leave the runner as patches.
#   push:   a fresh runner applies the patches to a clean clone, checks them with the guard
#           from the branch's own history, and pushes them, which starts the next review.
on:
  workflow_call:
    inputs:
      pr: { type: number, required: true }
      review_url: { type: string, required: true }
      head_sha: { type: string, required: true, description: "The commit the review judged" }
env:
  PR: ${{ inputs.pr }}
  GH_REPO: ${{ github.repository }}
jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: { contents: read, pull-requests: write, issues: write }
    outputs:
      round: ${{ steps.plan.outputs.round }}
      scopes: ${{ steps.plan.outputs.scopes }}
      branch: ${{ steps.plan.outputs.branch }}
      head: ${{ steps.plan.outputs.head }}
      handoff: ${{ steps.plan.outputs.handoff }}
      moved: ${{ steps.plan.outputs.moved }}
    steps:
      - name: Decide whether an agent may rework this PR
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          MAX_ROUNDS: ${{ vars.FACTORY_MAX_ROUNDS || '3' }}
          REVIEWED: ${{ inputs.head_sha }}
        run: |
          # Rework only the commit the review judged. If the branch moved since, the newer
          # commit gets its own review, so this round does nothing.
          current=$(gh pr view "$PR" --json headRefOid -q .headRefOid)
          if [ "$current" != "$REVIEWED" ]; then
            echo "The branch moved from $REVIEWED to $current after the review; no rework."
            echo "moved=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # A bad value must never lift the cap.
          if ! [[ "$MAX_ROUNDS" =~ ^[1-9][0-9]?$ ]]; then
            echo "::warning::FACTORY_MAX_ROUNDS='$MAX_ROUNDS' is not a number from 1 to 99; using 3"
            MAX_ROUNDS=3
          fi
          labels=$(gh pr view "$PR" --json labels -q '.labels[].name')
          n=$(echo "$labels" | sed -n 's/^rework-\([0-9]*\)$/\1/p' | sort -n | tail -n 1)
          n=${n:-0}
          scopes=$(gh pr diff "$PR" --name-only | awk -F/ 'NF { print ($1 ~ /^bun2too-/ && NF > 1) ? $1 : "root" }' | sort -u | tr '\n' ' ')
          # Rework may not edit factory files and the loop never merges a factory PR, so a
          # paid round on one fixes nothing (22 of 22 rounds on PR #6, 2026-11-19/20). The
          # path list comes from the base branch; if it cannot be read, assume a factory PR.
          base=$(gh pr view "$PR" --json baseRefName -q .baseRefName)
          factory_re=$(gh api -H "Accept: application/vnd.github.raw" \
            "repos/$GH_REPO/contents/.github/scripts/factory-paths.regex?ref=$base" 2>/dev/null | head -n 1 || true)
          printf '%s\n' .github/workflows/ci.yml AGENTS.md | grep -qE "${factory_re:-^$}" || factory_re=""
          files=$(gh api --paginate "repos/$GH_REPO/pulls/$PR/files" --jq '.[] | .filename, (.previous_filename // empty)')
          handoff=""
          if echo "$labels" | grep -qx ready-for-human; then
            handoff="This PR is already waiting for a person."
          elif [ -z "$factory_re" ] || printf '%s\n' "$files" | grep -qE "$factory_re"; then
            handoff="This PR changes the factory, which the rework agent may not edit and a person merges (AGENTS.md rules 10 and 12), so no paid rework round runs."
          elif [ "$n" -ge "$MAX_ROUNDS" ]; then
            handoff="$MAX_ROUNDS rework rounds did not pass review."
          fi
          {
            echo "round=$((n+1))"; echo "scopes=$scopes"; echo "handoff=$handoff"
            gh pr view "$PR" --json headRefName -q '"branch=\(.headRefName)"'
            echo "head=$REVIEWED"
          } >> "$GITHUB_OUTPUT"
      # Labels and comments use the workflow token, so they never start another run.
      - name: Hand to a person
        if: steps.plan.outputs.handoff != ''
        env: { GH_TOKEN: "${{ github.token }}", WHY: "${{ steps.plan.outputs.handoff }}" }
        run: |
          gh label create ready-for-human --force --color D93F0B --description "Needs a person: judgment, credentials, or a capped loop ran out"
          gh pr edit "$PR" --add-label ready-for-human
          gh pr comment "$PR" --body "$WHY Handing to a person; the latest review lists the open findings."
      # The agent-review label lets this round's push start the next review (AGENTS.md
      # rule 12); that review takes the label off again.
      - name: Mark round
        if: steps.plan.outputs.handoff == '' && steps.plan.outputs.moved != 'true'
        env: { GH_TOKEN: "${{ github.token }}", ROUND: "${{ steps.plan.outputs.round }}" }
        run: |
          gh label create "rework-$ROUND" --force --color FBCA04 --description "Factory rework round $ROUND"
          gh pr edit "$PR" --add-label "rework-$ROUND" --add-label agent-review

  rework:
    needs: plan
    if: needs.plan.outputs.handoff == '' && needs.plan.outputs.moved != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # Read-only: this job runs the agent. It holds only the model provider's key.
    permissions: { contents: read, pull-requests: read }
    env:
      ROUND: ${{ needs.plan.outputs.round }}
      SCOPES: ${{ needs.plan.outputs.scopes }}
    steps:
      # AGENTS.md rule 11, layer 3: only the hosts this job needs, the package registries
      # included. Keep this list in step with agent-review.yml and factory-sandbox-check.yml.
      - uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: block
          disable-telemetry: true
          allowed-endpoints: >
            api.anthropic.com:443 api.openai.com:443 generativelanguage.googleapis.com:443
            github.com:443 api.github.com:443 codeload.github.com:443
            objects.githubusercontent.com:443 release-assets.githubusercontent.com:443
            results-receiver.actions.githubusercontent.com:443 *.blob.core.windows.net:443
            registry.npmjs.org:443 bun.sh:443 claude.ai:443 downloads.claude.ai:443
            azure.archive.ubuntu.com:80 archive.ubuntu.com:80 security.ubuntu.com:80
            nodejs.org:443 pypi.org:443 files.pythonhosted.org:443
      - uses: actions/checkout@v5
        with: { ref: "${{ needs.plan.outputs.head }}", fetch-depth: 0, persist-credentials: false }
      - name: Prepare the branch and the review
        id: base
        env: { GH_TOKEN: "${{ github.token }}", REVIEW_URL: "${{ inputs.review_url }}" }
        run: |
          git config user.name "bun2too-software-factory[bot]"
          git config user.email "358801738+bun2too-software-factory[bot]@users.noreply.github.com"
          mkdir -p .factory && echo ".factory/" >> .git/info/exclude
          gh api "repos/$GH_REPO/issues/comments/${REVIEW_URL##*-}" -q .body > .factory/review.md
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      # Rule 11, layers 1 and 3, before any PR or dependency code runs: no sudo or Docker
      # from here on. The installs below run in contained.sh: they can write only their
      # product folder and the package caches, and nothing they start outlives them. The agent's own commands then run in Claude Code's sandbox.
      - uses: ./.github/actions/factory-lockdown
        with: { provider: "${{ vars.FACTORY_PROVIDER || 'anthropic' }}" }

      # Toolchains for the products the PR touches, matching ci.yml.
      - uses: pnpm/action-setup@v4
        if: contains(env.SCOPES, 'bun2too-support-agent')
        with: { package_json_file: bun2too-support-agent/package.json }
      - uses: actions/setup-node@v5
        if: contains(env.SCOPES, 'bun2too-support-agent')
        with:
          {
            node-version-file: bun2too-support-agent/.nvmrc,
            cache: pnpm,
            cache-dependency-path: bun2too-support-agent/pnpm-lock.yaml,
          }
      - uses: astral-sh/setup-uv@v6
        if: contains(env.SCOPES, 'bun2too-support-agent')
      - if: contains(env.SCOPES, 'bun2too-support-agent')
        run: |
          .github/scripts/contained.sh bun2too-support-agent "$HOME/.npm" "$HOME/.cache/pnpm" "$HOME/.cache/uv" "$HOME/.cache/pip" "$HOME/.local/share/pnpm" "$HOME/.local/share/uv" "$HOME/.local/state/pnpm" "$RUNNER_TEMP/setup-uv-cache" -- \
            sh -c 'pnpm -C bun2too-support-agent install --frozen-lockfile && uv sync --directory bun2too-support-agent/services/agents --frozen'
      - uses: actions/setup-python@v5
        if: contains(env.SCOPES, 'bun2too-crew-team')
        with: { python-version: "3.12" }
      - uses: actions/setup-node@v5
        if: contains(env.SCOPES, 'bun2too-crew-team')
        with: { node-version: "24" }
      - if: contains(env.SCOPES, 'bun2too-crew-team')
        run: |
          # Into a virtualenv inside the product folder, so the install writes nowhere else.
          # Not put on PATH: the install can write that folder, so later steps never run
          # from it. The agent calls its python by path, inside the sandbox.
          python3 -m venv bun2too-crew-team/.venv
          .github/scripts/contained.sh bun2too-crew-team "$HOME/.npm" "$HOME/.cache/pnpm" "$HOME/.cache/uv" "$HOME/.cache/pip" "$HOME/.local/share/pnpm" "$HOME/.local/share/uv" "$HOME/.local/state/pnpm" "$RUNNER_TEMP/setup-uv-cache" -- \
            bun2too-crew-team/.venv/bin/python -m pip install -r bun2too-crew-team/crewai_agents/requirements.txt
      - uses: actions/setup-node@v5
        if: contains(env.SCOPES, 'bun2too-website')
        with:
          {
            node-version-file: bun2too-website/.nvmrc,
            cache: npm,
            cache-dependency-path: bun2too-website/package-lock.json,
          }
      - if: contains(env.SCOPES, 'bun2too-website')
        run: .github/scripts/contained.sh bun2too-website "$HOME/.npm" "$HOME/.cache/pnpm" "$HOME/.cache/uv" "$HOME/.cache/pip" "$HOME/.local/share/pnpm" "$HOME/.local/share/uv" "$HOME/.local/state/pnpm" "$RUNNER_TEMP/setup-uv-cache" -- npm ci --prefix bun2too-website

      - uses: ./.github/actions/factory-agent
        id: agent
        continue-on-error: true
        with:
          provider: ${{ vars.FACTORY_PROVIDER || 'anthropic' }}
          model: ${{ vars.FACTORY_MODEL }}
          max-budget-usd: ${{ vars.FACTORY_MAX_BUDGET_USD || '0.50' }}
          max-turns: "60"
          github-token: ${{ github.token }}
          anthropic-api-key: ${{ secrets.ANTHROPIC_API_KEY }}
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}
          gemini-api-key: ${{ secrets.GEMINI_API_KEY }}
          trace-dir: ${{ runner.temp }}/trace
          allowed-tools: Read,Edit,Write,Glob,Grep,Agent,Bash(git status:*),Bash(git diff:*),Bash(git log:*),Bash(git show:*),Bash(git add:*),Bash(git commit:*),Bash(git restore:*),Bash(pnpm:*),Bash(uv:*),Bash(npm:*),Bash(node:*),Bash(python3:*),Bash(bun2too-crew-team/.venv/bin/python:*)
          prompt: |
            Act as the Rework role in docs/factory.md for PR #${{ env.PR }}, round ${{ env.ROUND }}.
            The review to answer is in .factory/review.md. Products this PR touches: ${{ env.SCOPES }}. Stay inside them.
            Factory files (.claude/, .cursor/, .github/, AGENTS.md, CLAUDE.md, docs/factory.md, docs/sdlc.md) are a
            person's to change: list findings in them as **needs a person** and do not edit them.
            Commit locally; you cannot push, and the workflow checks your commits before it pushes them.
            For the crew team, run Python as bun2too-crew-team/.venv/bin/python (its packages are installed there).
            Write your checklist to .factory/rework-report.md and do not commit anything under .factory/.

      # Everything below runs on this runner, which the agent could have changed, so it only
      # exports data. The push job treats it as untrusted and checks it.
      - name: Export the rework
        if: ${{ !cancelled() }}
        env: { BEFORE: "${{ steps.base.outputs.sha }}", CAUSE: "${{ steps.agent.outputs.cause }}" }
        run: |
          out="$RUNNER_TEMP/out" && mkdir -p "$out"
          cp .factory/rework-report.md "$out/report.md" 2>/dev/null ||
            echo "The Rework run wrote no report. ${CAUSE:+Cause: $CAUSE}" > "$out/report.md"
          # The agent could have edited .git/config, hooks or attributes, so git never runs on
          # this repository. It runs on a copy with those removed and a minimal config, and
          # reads no global or system config.
          exp="$RUNNER_TEMP/export.git"
          cp -R .git "$exp"
          rm -rf "$exp/config" "$exp/hooks" "$exp/info/attributes" "$exp/worktrees" \
            "$exp/objects/info/alternates" "$exp/objects/info/http-alternates"
          printf '[core]\n\trepositoryformatversion = 0\n\tbare = true\n' > "$exp/config"
          GIT_CONFIG_NOSYSTEM=1 GIT_CONFIG_GLOBAL=/dev/null git --git-dir="$exp" -c core.hooksPath=/dev/null \
            format-patch --binary --no-ext-diff --stdout "$BEFORE..HEAD" > "$out/rework.patch"
          # Later steps (the actions' post steps) may run git here: give them a clean config
          # and no hooks, whatever the agent wrote.
          rm -rf .git/hooks .git/info/attributes && mkdir .git/hooks
          printf '[core]\n\trepositoryformatversion = 0\n\tbare = false\n' > .git/config
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with: { name: rework, path: "${{ runner.temp }}/out/", if-no-files-found: error }
      # For agent-review's trace job only, which scans it and then deletes it.
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with: { name: trace-rework, path: "${{ runner.temp }}/trace/", if-no-files-found: ignore, retention-days: 1 }

  # A fresh runner: the only job here that holds the app token is one no agent touched.
  push:
    needs: [plan, rework]
    if: ${{ !cancelled() && needs.plan.outputs.handoff == '' && needs.plan.outputs.moved != 'true' && needs.rework.result != 'skipped' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions: { contents: read, pull-requests: write, issues: write }
    env:
      ROUND: ${{ needs.plan.outputs.round }}
      SCOPES: ${{ needs.plan.outputs.scopes }}
      BRANCH: ${{ needs.plan.outputs.branch }}
      BEFORE: ${{ needs.plan.outputs.head }}
    steps:
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with: { name: rework, path: in }
      # Rule 11, layer 4: nothing the agent wrote is pushed or posted if it holds a secret. The scan
      # comes from the PR's own .github/actions, as trusted as this workflow, which on a
      # pull_request run also comes from the PR. Agents cannot change it (the guard keeps
      # them out of .github/), so it is a control on the agent, not on the PR's author.
      - uses: actions/checkout@v5
        with: { ref: "${{ github.event.pull_request.head.sha }}", sparse-checkout: .github/actions, persist-credentials: false, path: scan }
      - uses: ./scan/.github/actions/secret-scan
        id: scan
        continue-on-error: true
        with:
          path: in
          anthropic-api-key: ${{ secrets.ANTHROPIC_API_KEY }}
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}
          gemini-api-key: ${{ secrets.GEMINI_API_KEY }}
      - name: Drop output that holds a secret
        env: { LEAK: "${{ steps.scan.outputs.found || 'unscanned' }}" }
        run: |
          [ "$LEAK" = false ] && exit 0
          rm -rf in && mkdir in
          if [ "$LEAK" = true ]; then
            echo "The rework's output contained a secret, so none of it was pushed or posted (AGENTS.md rule 11). Rotate the provider key." > in/report.md
          else
            echo "The secret scan of the rework's output did not run, so none of it was pushed or posted (AGENTS.md rule 11)." > in/report.md
          fi
      - name: Count the commits
        id: count
        run: echo "commits=$(grep -c '^From [0-9a-f]\{40\} ' in/rework.patch 2>/dev/null || true)" >> "$GITHUB_OUTPUT"
      - uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2.2.2
        id: app
        if: steps.count.outputs.commits != '0' && steps.count.outputs.commits != ''
        with:
          app-id: ${{ vars.FACTORY_APP_ID }}
          private-key: ${{ secrets.FACTORY_APP_PRIVATE_KEY }}
      # The push goes last: it starts the next review, which cancels this run.
      - name: Check the rework and push it
        env:
          GH_TOKEN: ${{ github.token }}
          PUSH_TOKEN: ${{ steps.app.outputs.token }}
          COMMITS: ${{ steps.count.outputs.commits }}
        run: |
          report=$(head -c 30000 in/report.md 2>/dev/null || echo "The Rework job did not finish; see the run log.")
          to_person() {
            gh label create ready-for-human --force --color D93F0B --description "Needs a person: judgment, credentials, or a capped loop ran out"
            gh pr edit "$PR" --add-label ready-for-human
          }
          if [ "${COMMITS:-0}" = 0 ] || [ -z "$BEFORE" ]; then
            to_person
            gh pr comment "$PR" --body "$(printf '## Rework round %s: no commits\n\n%s\n\nThere are no commits to push, so the review would fail again. Handing to a person.' "$ROUND" "$report")"
            exit 1
          fi
          # A clean clone: token only in a header, no hooks.
          auth="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$PUSH_TOKEN" | base64 -w0)"
          echo "::add-mask::${auth#AUTHORIZATION: basic }"
          git -c http.extraheader="$auth" clone -q --single-branch --branch "$BRANCH" "https://github.com/$GH_REPO.git" clean
          cd clean
          git config core.hooksPath /dev/null
          git config user.name "bun2too-software-factory[bot]"
          git config user.email "358801738+bun2too-software-factory[bot]@users.noreply.github.com"
          if [ "$(git rev-parse HEAD)" != "$BEFORE" ]; then
            gh pr comment "$PR" --body "## Rework round $ROUND: not pushed"$'\n\n'"The branch moved while the rework ran, so its commits were dropped. The next push gets a fresh review."
            exit 1
          fi
          if ! git am -q --keep-cr < ../in/rework.patch; then
            to_person
            gh pr comment "$PR" --body "## Rework round $ROUND: not pushed"$'\n\n'"The rework's commits did not apply cleanly. Handing to a person."
            exit 1
          fi
          # The guard as committed on the branch before the rework: nothing the agent wrote.
          git show "$BEFORE:.github/scripts/rework-guard.sh" > ../guard.sh
          if ! problems=$(bash ../guard.sh "$BEFORE" $SCOPES); then
            to_person
            gh pr comment "$PR" --body "$(printf '## Rework round %s: not pushed\n\nThe rework broke a factory rule, so its commits were discarded:\n\n%s\n\nHanding to a person.' "$ROUND" "$problems")"
            exit 1
          fi
          commits=$(git log --format='`%h` %s' "$BEFORE..HEAD" | paste -sd ',' - | sed 's/,/, /g')
          # The push starts the next review, which may cancel this job, so the comment is quick.
          git -c http.extraheader="$auth" push --no-verify origin "HEAD:refs/heads/$BRANCH"
          gh pr comment "$PR" --body "$(printf '## Rework round %s\n\n%s\n\nPushed %s. The review runs again on this push.' "$ROUND" "$report" "$commits")"
