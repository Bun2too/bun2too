name: retro
on:
  pull_request:
    types: [closed]
permissions:
  contents: write
  pull-requests: write
  id-token: write
jobs:
  # Off unless FACTORY_LEGACY_AGENTS=true: this agent still holds the app token while it
  # runs, unlike Review and Rework (ADR 0005). Moving it to the split-job pattern is open.
  retro:
    if: vars.FACTORY_ENABLED != 'false' && vars.FACTORY_LEGACY_AGENTS == 'true' && (vars.FACTORY_PROVIDER || 'anthropic') == 'anthropic' && github.event.pull_request.merged && endsWith(format('{0}', github.event.pull_request.number), '0')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/create-github-app-token@1b10c78c7865c340bc4f6099eb2f838309f1e8c3 # v3.1.1
        id: app
        with:
          app-id: ${{ vars.FACTORY_APP_ID }}
          private-key: ${{ secrets.FACTORY_APP_PRIVATE_KEY }}
      - uses: actions/checkout@v5
        with: { fetch-depth: 0, token: "${{ steps.app.outputs.token }}" }
      - uses: anthropics/claude-code-action@f431adaf77e0fecf918431e75a2b5b45b85af002 # v1.0.283
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          github_token: ${{ steps.app.outputs.token }}
          prompt: |
            Act as the Retro role in docs/factory.md for merged PR #${{ github.event.pull_request.number }}.
            Add enforcers to the touched product's docs/factory/enforcement.md (create it if the product has none). If nothing recurred, do nothing.
          claude_args: --model ${{ vars.FACTORY_MODEL || 'claude-sonnet-5-5' }} --max-budget-usd ${{ vars.FACTORY_MAX_BUDGET_USD || '1.00' }} --max-turns 60
