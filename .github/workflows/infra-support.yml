name: infra-support
# Plans and applies only from main. PRs get the credential-free checks in ci.yml
# (support-infra: fmt, validate, test): a plan evaluates PR-controlled Terraform, which
# could read and send these tokens.
on:
  push:
    branches: [main]
    paths: ['bun2too-support-agent/infra/terraform/railway/project/**']
  workflow_dispatch:
permissions:
  contents: read
concurrency: { group: infra-support, cancel-in-progress: false }
jobs:
  plan-or-apply:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: infra-support
    env:
      TF_CLOUD_ORGANIZATION: ${{ vars.TF_CLOUD_ORGANIZATION }}
      TF_WORKSPACE: bun2too-support-project
      TF_IN_AUTOMATION: "true"
      TF_VAR_railway_api_token: ${{ secrets.RAILWAY_API_TOKEN }}
      TF_VAR_workspace_id: ${{ vars.RAILWAY_WORKSPACE_ID }}
    defaults:
      {
        run:
          {
            working-directory: bun2too-support-agent/infra/terraform/railway/project,
          },
      }
    steps:
      - uses: actions/checkout@v5
      - uses: hashicorp/setup-terraform@v3
        with:
          {
            cli_config_credentials_token: "${{ secrets.TF_API_TOKEN }}",
            terraform_wrapper: false,
          }
      # Read-only: can the stored token see the workspace, and does it run locally? Prints
      # only the HTTP status, the name and the execution mode, never the token or the body.
      - name: Check the workspace
        env: { TF_TOKEN: "${{ secrets.TF_API_TOKEN }}" }
        run: |
          out="$RUNNER_TEMP/workspace.json"
          # The header goes in on stdin (printf is a shell builtin), so the token is never in
          # any process's argv, where another process on the runner could read it.
          code=$(printf 'Authorization: Bearer %s\n' "$TF_TOKEN" |
            curl -s -o "$out" -w '%{http_code}' --max-time 30 -H @- \
              -H "Content-Type: application/vnd.api+json" \
              "https://app.terraform.io/api/v2/organizations/$TF_CLOUD_ORGANIZATION/workspaces/$TF_WORKSPACE")
          echo "HTTP $code"
          if [ "$code" != 200 ]; then
            rm -f "$out"
            echo "::error::The token in this environment cannot see workspace $TF_WORKSPACE in organization $TF_CLOUD_ORGANIZATION (HTTP $code). Check the organization, the exact name and the token's team access."
            exit 1
          fi
          name=$(jq -r '.data.attributes.name // ""' "$out"); mode=$(jq -r '.data.attributes["execution-mode"] // ""' "$out")
          rm -f "$out"
          echo "workspace: $name"; echo "execution mode: $mode"
          [ "$mode" = local ] || { echo "::error::Set workspace $TF_WORKSPACE to Local execution; runs pass their inputs from this job."; exit 1; }
      - run: terraform init -input=false
      - name: Plan
        run: terraform plan -input=false -no-color -lock-timeout=5m
      - name: Apply
        run: terraform apply -input=false -auto-approve
