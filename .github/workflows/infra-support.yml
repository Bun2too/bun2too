name: infra-support
# Plans and applies only from main. PRs get the credential-free checks in ci.yml
# (support-infra: fmt, validate, test): a plan evaluates PR-controlled Terraform, which
# could read and send these tokens.
on:
  push:
    branches: [main]
    paths: ["bun2too-support-agent/infra/terraform/railway/project/**"]
  workflow_dispatch:
permissions:
  contents: read
concurrency: { group: infra-support, cancel-in-progress: false }
jobs:
  plan-or-apply:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: infra-support
    env:
      TF_CLOUD_ORGANIZATION: ${{ vars.TF_CLOUD_ORGANIZATION }}
      # The project layer's own workspace. The environment layer reads its state under the
      # same name (environment/variables.tf, project_workspace). It must not be one of the
      # environment workspaces: two configurations in one state destroy each other's resources.
      TF_WORKSPACE: bun2too-support-app
      TF_IN_AUTOMATION: "true"
      TF_VAR_railway_api_token: ${{ secrets.RAILWAY_API_TOKEN }}
      TF_VAR_workspace_id: ${{ vars.RAILWAY_WORKSPACE_ID }}
    defaults:
      {
        run:
          {
            working-directory: bun2too-support-agent/infra/terraform/railway/project,
          },
      }
    steps:
      - uses: actions/checkout@v5
      - uses: hashicorp/setup-terraform@v3
        with:
          {
            cli_config_credentials_token: "${{ secrets.TF_API_TOKEN }}",
            terraform_wrapper: false,
          }
      # Read-only: can the stored token see the workspace, and does it run locally?
      - name: Check the workspace
        env: { TF_TOKEN: "${{ secrets.TF_API_TOKEN }}" }
        run: '"$GITHUB_WORKSPACE/.github/scripts/tf-workspace-check.sh" "$TF_WORKSPACE"'
      - run: terraform init -input=false
      - name: Plan
        run: terraform plan -input=false -no-color -lock-timeout=5m
      - name: Apply
        run: terraform apply -input=false -auto-approve
