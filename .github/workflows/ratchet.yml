name: ratchet
on:
  schedule: [{ cron: "0 6 * * *" }]
  workflow_dispatch:
permissions:
  contents: write
  pull-requests: write
  id-token: write
concurrency: { group: ratchet, cancel-in-progress: false }
jobs:
  ratchet:
    if: vars.FACTORY_ENABLED != 'false' && (vars.FACTORY_PROVIDER || 'anthropic') == 'anthropic'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2.2.2
        id: app
        with:
          app-id: ${{ vars.FACTORY_APP_ID }}
          private-key: ${{ secrets.FACTORY_APP_PRIVATE_KEY }}
      - uses: actions/checkout@v5
        with: { token: "${{ steps.app.outputs.token }}" }
      - name: Skip if a ratchet PR is open
        id: open
        env: { GH_TOKEN: "${{ github.token }}" }
        run: echo "count=$(gh pr list --label ratchet --state open --json number -q length)" >> "$GITHUB_OUTPUT"
      - uses: pnpm/action-setup@v4
        if: steps.open.outputs.count == '0'
        with: { package_json_file: bun2too-support-agent/package.json }
      - uses: actions/setup-node@v5
        if: steps.open.outputs.count == '0'
        with:
          {
            node-version-file: bun2too-support-agent/.nvmrc,
            cache: pnpm,
            cache-dependency-path: bun2too-support-agent/pnpm-lock.yaml,
          }
      - uses: astral-sh/setup-uv@v6
        if: steps.open.outputs.count == '0'
      - if: steps.open.outputs.count == '0'
        run: pnpm -C bun2too-support-agent install --frozen-lockfile && uv sync --directory bun2too-support-agent/services/agents --frozen
      - uses: anthropics/claude-code-action@f431adaf77e0fecf918431e75a2b5b45b85af002 # v1.0.283
        if: steps.open.outputs.count == '0'
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          github_token: ${{ steps.app.outputs.token }}
          prompt: |
            Act as the Ratchet role in docs/factory.md for the support agent. Remove the first entry from bun2too-support-agent/docs/factory/ratchet.txt, make that path pass the named stricter rule,
            run pnpm -C bun2too-support-agent check, and open a PR labelled ratchet on a branch named agent/ratchet-<today, YYYYMMDD>. Change nothing else.
          claude_args: --model ${{ vars.FACTORY_MODEL || 'claude-sonnet-5-5' }} --max-budget-usd ${{ vars.FACTORY_MAX_BUDGET_USD || '1.00' }} --max-turns 60
