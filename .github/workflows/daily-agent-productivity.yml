name: daily-agent-productivity

on:
  schedule:
    - cron: "17 10 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read
  actions: read

concurrency:
  group: daily-agent-productivity
  cancel-in-progress: false

jobs:
  report:
    if: github.event_name == 'schedule' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: metrics
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Collect GitHub metadata and publish the UTC report
        env:
          GITHUB_TOKEN: ${{ github.token }}
          CONFLUENCE_BASE_URL: ${{ vars.CONFLUENCE_BASE_URL }}
          CONFLUENCE_CLOUD_ID: ${{ vars.CONFLUENCE_CLOUD_ID }}
          CLAUDE_ATLASSIAN_CLIENT_ID: ${{ secrets.CLAUDE_ATLASSIAN_CLIENT_ID }}
          CLAUDE_ATLASSIAN_CLIENT_SECRET: ${{ secrets.CLAUDE_ATLASSIAN_CLIENT_SECRET }}
          METRICS_OUTPUT_DIR: artifacts/daily-agent-productivity
        run: python3 scripts/metrics/daily_productivity.py
      - name: Preserve the report artifact
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: daily-agent-productivity-${{ github.run_id }}
          path: artifacts/daily-agent-productivity/
          retention-days: 90
          if-no-files-found: ignore
