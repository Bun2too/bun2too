name: agent-implement
on:
  issues:
    types: [labeled]
permissions:
  contents: write
  pull-requests: write
  issues: write
  id-token: write
concurrency:
  group: agent-implement-${{ github.event.issue.number }}
  cancel-in-progress: false
jobs:
  implement:
    if: github.event.label.name == 'ready-for-agent'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0, token: "${{ secrets.FACTORY_TOKEN }}" }
      - uses: pnpm/action-setup@v4
        with: { package_json_file: bun2too-support-agent/package.json }
      - uses: actions/setup-node@v4
        with: { node-version-file: bun2too-support-agent/.nvmrc, cache: pnpm, cache-dependency-path: bun2too-support-agent/pnpm-lock.yaml }
      - uses: astral-sh/setup-uv@v6
      - run: pnpm -C bun2too-support-agent install --frozen-lockfile && uv sync --directory bun2too-support-agent/services/agents --frozen
      - run: git checkout -b agent/issue-${{ github.event.issue.number }}
      - uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          github_token: ${{ secrets.FACTORY_TOKEN }}
          prompt: Act as the Implement role in docs/factory.md for issue #${{ github.event.issue.number }}. Follow the lifecycle in docs/sdlc.md (/build) and the AGENTS.md of the product the issue's area label names.
          claude_args: --max-turns 120
