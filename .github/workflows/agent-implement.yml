name: agent-implement
on:
  issues:
    types: [labeled]
permissions:
  contents: write
  pull-requests: write
  issues: write
  id-token: write
concurrency:
  group: agent-implement-${{ github.event.issue.number }}
  cancel-in-progress: false
jobs:
  # Off unless FACTORY_LEGACY_AGENTS=true: this agent still holds the app token while it
  # runs, unlike Review and Rework (ADR 0005). Moving it to the split-job pattern is open.
  implement:
    if: vars.FACTORY_ENABLED != 'false' && vars.FACTORY_LEGACY_AGENTS == 'true' && (vars.FACTORY_PROVIDER || 'anthropic') == 'anthropic' && github.event.label.name == 'ready-for-agent'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/create-github-app-token@1b10c78c7865c340bc4f6099eb2f838309f1e8c3 # v3.1.1
        id: app
        with:
          app-id: ${{ vars.FACTORY_APP_ID }}
          private-key: ${{ secrets.FACTORY_APP_PRIVATE_KEY }}
      - uses: actions/checkout@v5
        with: { fetch-depth: 0, token: "${{ steps.app.outputs.token }}" }
      - uses: pnpm/action-setup@v5
        with: { package_json_file: bun2too-support-agent/package.json }
      - uses: actions/setup-node@v5
        with:
          {
            node-version-file: bun2too-support-agent/.nvmrc,
            cache: pnpm,
            cache-dependency-path: bun2too-support-agent/pnpm-lock.yaml,
          }
      - uses: astral-sh/setup-uv@v7
      - run: pnpm -C bun2too-support-agent install --frozen-lockfile && uv sync --directory bun2too-support-agent/services/agents --frozen
      - run: git checkout -b agent/issue-${{ github.event.issue.number }}
      - uses: anthropics/claude-code-action@f431adaf77e0fecf918431e75a2b5b45b85af002 # v1.0.283
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          github_token: ${{ steps.app.outputs.token }}
          prompt: Act as the Implement role in docs/factory.md for issue #${{ github.event.issue.number }}. Follow the lifecycle in docs/sdlc.md (/build) and the AGENTS.md of the product the issue's area label names.
          claude_args: --model ${{ vars.FACTORY_MODEL || 'claude-sonnet-5-5' }} --max-budget-usd ${{ vars.FACTORY_MAX_BUDGET_USD || '1.00' }} --max-turns 120
