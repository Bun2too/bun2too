name: factory-agent
description: >-
  Run one factory agent turn on the provider and model the repository chose
  (FACTORY_PROVIDER, FACTORY_MODEL). The agent only reads and writes files in the
  workspace; the calling workflow posts comments and pushes.
inputs:
  provider: { description: "anthropic, openai or gemini", required: true }
  model: { description: "Model name; anthropic defaults to claude-sonnet-5-5", required: false, default: "" }
  max-budget-usd: { description: "Spend cap for this run (enforced on anthropic only)", required: true }
  max-turns: { description: "Turn cap (anthropic only)", required: true }
  allowed-tools: { description: "Claude Code --allowedTools list (anthropic only)", required: true }
  prompt: { description: "The task", required: true }
  github-token: { description: "Token claude-code-action needs for its own setup", required: true }
  anthropic-api-key: { required: false, default: "" }
  openai-api-key: { required: false, default: "" }
  gemini-api-key: { required: false, default: "" }
  read-only:
    description: >-
      true: the agent may not write files (Codex runs :read-only). false: it may also run the
      PR's code, so AGENTS.md rule 11 applies: run factory-lockdown first, and Gemini is refused.
    required: false
    default: "false"
  output-file: { description: "Where to save the agent's final message", required: false, default: "" }
outputs:
  cause:
    description: The agent's last message when it failed, for the PR comment.
    value: ${{ steps.result.outputs.cause }}
  execution-file:
    description: Claude Code's run record (anthropic only), for checks such as factory-sandbox-check.
    value: ${{ steps.claude.outputs.execution_file }}
runs:
  using: composite
  steps:
    - name: Check the provider settings
      shell: bash
      env:
        PROVIDER: ${{ inputs.provider }}
        MODEL: ${{ inputs.model }}
        READ_ONLY: ${{ inputs.read-only }}
        HAS_KEY: ${{ (inputs.provider == 'anthropic' && inputs.anthropic-api-key != '') || (inputs.provider == 'openai' && inputs.openai-api-key != '') || (inputs.provider == 'gemini' && inputs.gemini-api-key != '') }}
      run: |
        case "$PROVIDER" in anthropic | openai | gemini) ;; *)
          echo "::error::FACTORY_PROVIDER must be anthropic, openai or gemini, not '$PROVIDER'"; exit 1 ;;
        esac
        if [ "$PROVIDER" != anthropic ] && [ -z "$MODEL" ]; then
          echo "::error::Set the FACTORY_MODEL variable to the $PROVIDER model the factory should use"; exit 1
        fi
        if [ "$HAS_KEY" != true ]; then
          echo "::error::The secret for $PROVIDER is missing (ANTHROPIC_API_KEY, OPENAI_API_KEY or GEMINI_API_KEY)"; exit 1
        fi
        # Rule 11: Gemini CLI runs commands unsandboxed with the key in their environment,
        # so it gets no shell, and a role that must run code cannot use it.
        if [ "$PROVIDER" = gemini ] && [ "$READ_ONLY" != true ]; then
          echo "::error::Gemini CLI has no command sandbox here, so it cannot run an agent that runs code (AGENTS.md rule 11). Use anthropic or openai."; exit 1
        fi
        echo "Factory agent: $PROVIDER ${MODEL:-claude-sonnet-5-5}"

    # Rule 11, layers 1 and 2, written to ~/.claude/settings.json by claude-code-action:
    # - every Bash command runs in the sandbox, with no network and no unsandboxed retry;
    #   if the sandbox cannot start, Claude Code exits instead of running commands bare
    # - nothing prompts, so anything not allowlisted is denied
    # - the file tools read and write only the workspace and the toolchain caches, so they
    #   cannot read the key from /proc or the runner's temp files
    # - no hooks, and (with --strict-mcp-config) no MCP servers from the checkout: both would
    #   run outside the sandbox, and a PR could add them
    # CLAUDE_CODE_SUBPROCESS_ENV_SCRUB on the step strips the key from every command's environment.
    - name: Configure the Claude Code sandbox
      id: claude-settings
      if: inputs.provider == 'anthropic'
      shell: bash
      run: |
        json=$(jq -cn --arg home "$HOME" '{
          permissions: {
            blockReadsOutsideWorkingDirectories: true,
            blockWritesOutsideWorkingDirectories: true,
            denyInsteadOfPrompting: true,
            disableBypassPermissionsMode: "disable",
            additionalDirectories: [($home + "/.cache"), ($home + "/.local/share"), ($home + "/setup-pnpm")],
            deny: ["WebFetch", "WebSearch", "Read(//proc/**)"]
          },
          disableAllHooks: true,
          sandbox: {
            enabled: true,
            failIfUnavailable: true,
            allowUnsandboxedCommands: false,
            autoAllowBashIfSandboxed: false,
            network: { allowedDomains: [], strictAllowlist: true }
          }
        }')
        echo "json=$json" >> "$GITHUB_OUTPUT"

    - name: Run Claude Code
      id: claude
      if: inputs.provider == 'anthropic'
      uses: anthropics/claude-code-action@f431adaf77e0fecf918431e75a2b5b45b85af002 # v1.0.283
      env:
        CLAUDE_CODE_SUBPROCESS_ENV_SCRUB: "1"
      with:
        anthropic_api_key: ${{ inputs.anthropic-api-key }}
        github_token: ${{ inputs.github-token }}
        show_full_output: true
        settings: ${{ steps.claude-settings.outputs.json }}
        prompt: ${{ inputs.prompt }}
        claude_args: >-
          --model ${{ inputs.model || 'claude-sonnet-5-5' }}
          --permission-mode dontAsk
          --strict-mcp-config
          --max-turns ${{ inputs.max-turns }}
          --max-budget-usd ${{ inputs.max-budget-usd }}
          --allowedTools "${{ inputs.allowed-tools }}"
          --disallowedTools "Bash(git diff *--output*),Bash(git log *--output*),Bash(git show *--output*),Bash(git diff *--ext-diff*),Bash(git log *--ext-diff*),Bash(git show *--ext-diff*)"

    - name: Run Codex
      id: codex
      if: inputs.provider == 'openai'
      uses: openai/codex-action@306c6a196a99dcc6582530c396a19d2672d5e9ec # v1.14
      with:
        openai-api-key: ${{ inputs.openai-api-key }}
        model: ${{ inputs.model }}
        prompt: ${{ inputs.prompt }}
        # Writes inside the workspace, no network: the workflow does every GitHub write.
        # The key stays in the action's API proxy, out of the commands' environment, and
        # the default safety-strategy (drop-sudo) takes sudo and Docker away first.
        permission-profile: ${{ inputs.read-only == 'true' && ':read-only' || ':workspace' }}

    # Gemini CLI runs with --yolo and cannot sandbox commands, so it gets no shell at all
    # (AGENTS.md rule 11): only the file tools from the allowed-tools list, mapped to
    # Gemini's names. Anything else, the shell and web access included, is off. The calling
    # workflow puts what the agent would run git for (the diff) in a file first.
    - name: Limit Gemini to the allowed tools
      id: gemini-settings
      if: inputs.provider == 'gemini'
      shell: bash
      env: { ALLOWED: "${{ inputs.allowed-tools }}" }
      run: |
        json=$(printf '%s' "$ALLOWED" | tr ',' '\n' | jq -R . | jq -cs '
          map(
            if . == "Read" then "read_file", "read_many_files"
            elif . == "Grep" then "grep_search", "search_file_content"
            elif . == "Glob" then "glob", "list_directory"
            elif . == "Write" then "write_file"
            elif . == "Edit" then "replace"
            else empty end)
          | {context: {fileName: ["AGENTS.md"]}, tools: {core: ., exclude: ["run_shell_command"]}}')
        echo "json=$json" >> "$GITHUB_OUTPUT"
        echo "Gemini settings: $json"

    - name: Run Gemini CLI
      id: gemini
      if: inputs.provider == 'gemini'
      uses: google-github-actions/run-gemini-cli@f77273f4c914e4bf38440cf36a0369cb64a37489 # v0.1.22
      with:
        gemini_api_key: ${{ inputs.gemini-api-key }}
        gemini_model: ${{ inputs.model }}
        prompt: ${{ inputs.prompt }}
        settings: ${{ steps.gemini-settings.outputs.json }}

    - name: Record the outcome
      id: result
      if: always()
      shell: bash
      env:
        EXECUTION_FILE: ${{ steps.claude.outputs.execution_file }}
        GEMINI_ERROR: ${{ steps.gemini.outputs.error }}
        CODEX_FINAL: ${{ steps.codex.outputs.final-message }}
        GEMINI_FINAL: ${{ steps.gemini.outputs.summary }}
        OUTPUT_FILE: ${{ inputs.output-file }}
      run: |
        if [ -n "$OUTPUT_FILE" ]; then
          mkdir -p "$(dirname "$OUTPUT_FILE")"
          if [ -n "$EXECUTION_FILE" ] && [ -f "$EXECUTION_FILE" ]; then
            jq -r '[.[] | select(.type == "result" and .is_error != true)] | last | .result // empty' "$EXECUTION_FILE" > "$OUTPUT_FILE"
          else
            printf '%s\n' "${CODEX_FINAL:-$GEMINI_FINAL}" > "$OUTPUT_FILE"
          fi
        fi
        cause=""
        if [ -n "$EXECUTION_FILE" ] && [ -f "$EXECUTION_FILE" ]; then
          cause=$(jq -r '[.[] | select(.type == "result" and .is_error == true)] | last | .result // empty' "$EXECUTION_FILE")
        fi
        cause=${cause:-$GEMINI_ERROR}
        { echo "cause<<CAUSE_EOF"; printf '%s\n' "${cause:0:500}"; echo "CAUSE_EOF"; } >> "$GITHUB_OUTPUT"
