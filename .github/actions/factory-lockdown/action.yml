name: factory-lockdown
description: >-
  AGENTS.md rule 11, layers 1 and 3: install the command sandbox, then take sudo and
  Docker away from the runner account so nothing the agent runs can undo the sandbox or
  the job's outbound allowlist (step-security/harden-runner, the job's first step).
  Run it after the dependency installs and right before the agent.
inputs:
  provider:
    description: "FACTORY_PROVIDER. openai: codex-action drops sudo itself (safety-strategy drop-sudo)"
    required: true
runs:
  using: composite
  steps:
    - name: Install the command sandbox
      shell: bash
      run: |
        # Other apt sources may be outside the allowlist; the Ubuntu archive is enough here.
        sudo apt-get update -qq || true
        sudo apt-get install -y -qq --no-install-recommends bubblewrap socat
        # Ubuntu restricts user namespaces with AppArmor. Its bwrap-userns-restrict profile
        # lets bwrap in but strips capabilities from what runs inside, which stops Claude
        # Code's seccomp helper. Use the profile Claude Code's docs give for /usr/bin/bwrap.
        echo "AppArmor profiles for bwrap: $(ls /etc/apparmor.d | grep -i bwrap | tr '\n' ' ')"
        if [ -f /etc/apparmor.d/bwrap-userns-restrict ]; then
          sudo apparmor_parser -R /etc/apparmor.d/bwrap-userns-restrict 2>/dev/null || true
          sudo mv /etc/apparmor.d/bwrap-userns-restrict /etc/apparmor.d/disable/ 2>/dev/null || sudo rm -f /etc/apparmor.d/bwrap-userns-restrict
        fi
        printf '%s\n' 'abi <abi/4.0>,' 'include <tunables/global>' '' \
          'profile bwrap /usr/bin/bwrap flags=(unconfined) {' '  userns,' '  include if exists <local/bwrap>' '}' |
          sudo install -m 0644 /dev/stdin /etc/apparmor.d/bwrap
        sudo apparmor_parser -r /etc/apparmor.d/bwrap
        if [ -f /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]; then
          sudo sysctl -qw kernel.apparmor_restrict_unprivileged_userns=0
        fi
        # The same shape Claude Code uses: a sandbox with no network that sets up a nested
        # user namespace inside.
        bwrap --ro-bind / / --dev /dev --proc /proc --unshare-user --unshare-net -- \
          unshare --user --map-root-user true ||
          { echo "::error::The command sandbox (bubblewrap) does not start on this runner"; exit 1; }

    - name: Take sudo and Docker away
      if: inputs.provider != 'openai'
      shell: bash
      run: |
        sudo systemctl stop docker.socket docker.service containerd.service 2>/dev/null || true
        sudo rm -f /var/run/docker.sock /run/containerd/containerd.sock
        # sudoers uses the last matching rule, and this file sorts last. It takes effect the
        # moment it exists, so it is written with its final mode in one command, the last sudo.
        echo "$USER ALL=(ALL:ALL) !ALL" | sudo install -m 0440 /dev/stdin /etc/sudoers.d/zzz-factory-no-sudo

    # Fail closed: the agent must not start on a runner where these still work.
    - name: Check the lockdown
      shell: bash
      env: { PROVIDER: "${{ inputs.provider }}" }
      run: |
        [ "$PROVIDER" = openai ] && { echo "Codex drops sudo before it starts."; exit 0; }
        if sudo -n true 2>/dev/null; then echo "::error::sudo still works"; exit 1; fi
        if docker info >/dev/null 2>&1; then echo "::error::Docker still works"; exit 1; fi
        echo "sudo and Docker are off; the sandbox starts."
