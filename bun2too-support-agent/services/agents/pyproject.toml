[project]
name = "relay-agents"
version = "0.1.0"
description = "Relay orchestrator, specialists, case store and ticket connectors"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.118",
  "uvicorn[standard]>=0.37",
  "pydantic>=2.11",
  "httpx>=0.28",
  "pyyaml>=6.0.2",
  "langchain>=1.0",
  "langchain-core>=1.0",
  "langgraph>=1.0",
  "langchain-anthropic>=1.0",
  "langsmith[otel]>=0.14.9",
  "opentelemetry-api>=1.37",
  "opentelemetry-sdk>=1.37",
  "opentelemetry-exporter-otlp-proto-http>=1.37",
  "opentelemetry-instrumentation-fastapi>=0.58b0",
  "opentelemetry-instrumentation-httpx>=0.58b0",
]

[dependency-groups]
dev = [
  "pytest>=8.4",
  "pytest-asyncio>=1.2",
  "ruff>=0.13",
  "mypy>=1.18",
  "jsonschema>=4.25",
  "types-PyYAML>=6.0",
  "types-jsonschema>=4.25",
  "pytest-cov>=7.0",
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/relay_agents"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF", "TID", "ASYNC", "PT", "S"]
ignore = ["S101"]

[tool.ruff.lint.flake8-tidy-imports.banned-api]
"langchain_anthropic".msg = "Get models from relay_agents.llm.chat_model (AGENTS.md rule 9)."
"langchain.chat_models".msg = "Get models from relay_agents.llm.chat_model (AGENTS.md rule 9)."

[tool.ruff.lint.per-file-ignores]
"src/relay_agents/llm.py" = ["TID251"]
"tests/**" = ["S105", "S106"]

[tool.mypy]
strict = true
files = ["src", "tests"]
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["langgraph.*", "langchain.*", "langchain_core.*"]
follow_untyped_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
