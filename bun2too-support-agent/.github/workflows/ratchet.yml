name: ratchet
on:
  schedule: [{ cron: "0 6 * * *" }]
  workflow_dispatch:
permissions:
  contents: write
  pull-requests: write
  id-token: write
concurrency: { group: ratchet, cancel-in-progress: false }
jobs:
  ratchet:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with: { token: "${{ secrets.FACTORY_TOKEN }}" }
      - name: Skip if a ratchet PR is open
        id: open
        env: { GH_TOKEN: "${{ github.token }}" }
        run: echo "count=$(gh pr list --label ratchet --state open --json number -q length)" >> "$GITHUB_OUTPUT"
      - uses: pnpm/action-setup@v4
        if: steps.open.outputs.count == '0'
      - uses: actions/setup-node@v4
        if: steps.open.outputs.count == '0'
        with: { node-version-file: .nvmrc, cache: pnpm }
      - uses: astral-sh/setup-uv@v6
        if: steps.open.outputs.count == '0'
      - if: steps.open.outputs.count == '0'
        run: pnpm install --frozen-lockfile && uv sync --directory services/agents --frozen
      - uses: anthropics/claude-code-action@v1
        if: steps.open.outputs.count == '0'
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          github_token: ${{ secrets.FACTORY_TOKEN }}
          prompt: |
            Ratchet task (docs/factory/README.md). Remove the first entry from docs/factory/ratchet.txt, make that path pass the named stricter rule,
            run pnpm check, and open a PR labelled ratchet on a branch named agent/ratchet-<today, YYYYMMDD>. Change nothing else.
          claude_args: --max-turns 60
