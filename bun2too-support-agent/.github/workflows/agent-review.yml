name: agent-review
on:
  pull_request:
    types: [opened, synchronize, ready_for_review, labeled]
permissions:
  contents: read
  pull-requests: write
  issues: read
  id-token: write
concurrency:
  group: agent-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  review:
    if: github.event.pull_request.draft == false || contains(github.event.pull_request.labels.*.name, 'agent-review')
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          prompt: |
            Follow .claude/skills/factory-review/SKILL.md for PR #${{ github.event.pull_request.number }}.
            Base branch: origin/${{ github.event.pull_request.base.ref }}. Post exactly one comment with gh pr comment.
          claude_args: --max-turns 40 --allowedTools "Read,Grep,Glob,Agent,Bash(git diff:*),Bash(git log:*),Bash(git merge-base:*),Bash(gh pr view:*),Bash(gh pr diff:*),Bash(gh issue view:*),Bash(gh pr comment:*)"
