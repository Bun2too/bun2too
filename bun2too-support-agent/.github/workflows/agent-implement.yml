name: agent-implement
on:
  issues:
    types: [labeled]
permissions:
  contents: write
  pull-requests: write
  issues: write
  id-token: write
concurrency:
  group: agent-implement-${{ github.event.issue.number }}
  cancel-in-progress: false
jobs:
  implement:
    if: github.event.label.name == 'ready-for-agent'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0, token: "${{ secrets.FACTORY_TOKEN }}" }
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version-file: .nvmrc, cache: pnpm }
      - uses: astral-sh/setup-uv@v6
      - run: pnpm install --frozen-lockfile && uv sync --directory services/agents --frozen
      - run: git checkout -b agent/issue-${{ github.event.issue.number }}
      - uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          github_token: ${{ secrets.FACTORY_TOKEN }}
          prompt: Act as the implementer subagent defined in .claude/agents/implementer.md for issue #${{ github.event.issue.number }}.
          claude_args: --max-turns 120
