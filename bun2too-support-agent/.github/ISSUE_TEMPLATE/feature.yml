name: Feature
description: New or changed behaviour
labels: [needs-triage]
body:
  - type: textarea
    id: problem
    attributes:
      { label: Problem, description: Whose problem is it and what does it cost them today? }
    validations: { required: true }
  - type: textarea
    id: done
    attributes: { label: Done when, description: Observable checks that prove it works. }
    validations: { required: true }
