name: Bug
description: Something Relay does wrong
labels: [needs-triage]
body:
  - type: textarea
    id: what
    attributes:
      { label: What happened, description: Include the case ID and trace ID if you have them. }
    validations: { required: true }
  - type: textarea
    id: expected
    attributes: { label: What should have happened }
    validations: { required: true }
  - type: textarea
    id: repro
    attributes: { label: How to reproduce, description: The intake text, channel and tenant. }
