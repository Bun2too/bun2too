name: crew-observability
services:
  collector:
    image: otel/opentelemetry-collector-contrib:0.123.0
    user: "0:0"
    command: ["--config=/etc/otelcol/config.yaml"]
    environment:
      TRACE_BACKEND_ENDPOINT: http://tempo:4318
      LOG_BACKEND_ENDPOINT: http://loki:3100/otlp
    volumes:
      - ./collector.yaml:/etc/otelcol/config.yaml:ro
      - collector-data:/var/lib/otelcol
    ports:
      - "127.0.0.1:4318:4318"
    depends_on: [tempo, loki]
    restart: unless-stopped
  tempo:
    image: grafana/tempo:2.7.2
    user: "0:0"
    command: ["-config.file=/etc/tempo.yaml"]
    volumes:
      - ./tempo.yaml:/etc/tempo.yaml:ro
      - tempo-data:/var/tempo
    restart: unless-stopped
  loki:
    image: grafana/loki:3.4.3
    user: "0:0"
    command: ["-config.file=/etc/loki/config.yaml"]
    volumes:
      - ./loki.yaml:/etc/loki/config.yaml:ro
      - loki-data:/loki
    restart: unless-stopped
  prometheus:
    image: prom/prometheus:v3.2.1
    command: ["--config.file=/etc/prometheus/prometheus.yaml", "--storage.tsdb.retention.time=30d"]
    volumes:
      - ./prometheus.yaml:/etc/prometheus/prometheus.yaml:ro
      - ./alerts.yaml:/etc/prometheus/alerts.yaml:ro
      - prometheus-data:/prometheus
    ports: ["127.0.0.1:9090:9090"]
    depends_on: [collector]
    restart: unless-stopped
  grafana:
    image: grafana/grafana:11.6.0
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?Set GRAFANA_ADMIN_PASSWORD}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    ports: ["127.0.0.1:3000:3000"]
    depends_on: [prometheus, tempo, loki]
    restart: unless-stopped
volumes:
  collector-data:
  tempo-data:
  loki-data:
  prometheus-data:
  grafana-data:
