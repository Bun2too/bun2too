name: Publish package to Bun2too

on:
  workflow_call:
    inputs:
      kind:
        description: container, npm, maven, or gradle
        type: string
        required: true
      directory:
        type: string
        required: true
      image-name:
        description: Container name below ghcr.io/bun2too
        type: string
        default: bun2too-crew-team

permissions:
  contents: read
  packages: write

jobs:
  publish:
    if: github.repository_owner == 'Bun2too' && (github.ref_name == 'main' || github.ref_name == 'qa')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: package-${{ github.repository }}-${{ inputs.kind }}-${{ inputs.directory }}-${{ github.ref_name }}
      cancel-in-progress: false
    env:
      PACKAGE_KIND: ${{ inputs.kind }}
      PACKAGE_DIRECTORY: ${{ inputs.directory }}
      PACKAGE_IMAGE_NAME: ${{ inputs.image-name }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Validate package target
        id: target
        run: python3 scripts/publish_package.py validate
      - uses: actions/setup-node@v6
        if: inputs.kind == 'npm'
        with:
          node-version: '24'
          registry-url: https://npm.pkg.github.com
          scope: '@bun2too'
          package-manager-cache: false
      - uses: actions/setup-java@v5
        if: inputs.kind == 'maven' || inputs.kind == 'gradle'
        with:
          distribution: temurin
          java-version: '21'
          server-id: github
          server-username: GITHUB_ACTOR
          server-password: GITHUB_TOKEN
      - uses: docker/setup-buildx-action@v3
        if: inputs.kind == 'container'
      - uses: docker/login-action@v3
        if: inputs.kind == 'container'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push container
        id: image
        if: inputs.kind == 'container'
        uses: docker/build-push-action@v6
        with:
          context: ${{ inputs.directory }}
          push: true
          platforms: linux/amd64
          tags: |
            ${{ steps.target.outputs.image }}:sha-${{ github.sha }}
            ${{ steps.target.outputs.image }}:${{ github.ref_name }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=${{ inputs.image-name }}
          cache-to: type=gha,mode=max,scope=${{ inputs.image-name }}
      - name: Verify pushed image by digest
        if: inputs.kind == 'container'
        env:
          IMAGE: ${{ steps.target.outputs.image }}
          DIGEST: ${{ steps.image.outputs.digest }}
        run: |
          test -n "$DIGEST"
          docker buildx imagetools inspect "$IMAGE@$DIGEST"
          printf '\nPublished container: `%s@%s`\n' "$IMAGE" "$DIGEST" >> "$GITHUB_STEP_SUMMARY"
      - name: Build, test and publish language package
        if: inputs.kind != 'container'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/publish_package.py publish
