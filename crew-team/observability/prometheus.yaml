global:
  scrape_interval: 15s
  evaluation_interval: 15s
rule_files: [/etc/prometheus/alerts.yaml]
scrape_configs:
  - job_name: crew-signals
    static_configs:
      - targets: [collector:8889]
  - job_name: collector-health
    static_configs:
      - targets: [collector:8888]
# Production: configure alerting.alertmanagers and the organization's receivers.
